name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed debug keystore
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dynamic-island-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-debug-${{ github.run_number }}
          path: dist/dynamic-island-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Rolling pre-release so the newest APK has a plain download link (easy on a phone).
      - name: Move the latest-debug tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest-debug
          git push -f origin latest-debug

      - name: Publish the latest debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          body: |
            Debug build of commit ${{ github.sha }}.
            Uninstall older builds first if Android refuses to update.
          prerelease: true
          files: dist/dynamic-island-debug.apk
